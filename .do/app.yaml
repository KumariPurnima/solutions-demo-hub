name: solutions-demo-hub
region: nyc
services:
  - name: web
    git:
      repo_clone_url: https://github.com/KumariPurnima/solutions-demo-hub.git
      branch: main
    source_dir: /
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 8080
    routes:
      - path: /
    run_command: npm start
    health_check:
      http_path: /api/health
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: GOOGLE_SHEET_ID
        scope: RUN_TIME
        value: "1AUYS2mF28aLeHb8LSq6FNXZD9lM7Qva4ey4t79vGHJo"
      - key: GOOGLE_SHEETS_PUBLIC
        scope: RUN_TIME
        value: "true"
      - key: CATALOG_CACHE_MS
        scope: RUN_TIME
        value: "60000"
      - key: SYNC_SECRET
        scope: RUN_TIME
        type: SECRET
        value: "${SYNC_SECRET}"
      - key: SYNC_WEBHOOK_URL
        scope: RUN_TIME
        type: SECRET
        value: "${SYNC_WEBHOOK_URL}"
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
